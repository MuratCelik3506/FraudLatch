[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudstream"
version = "0.1.0"
description = "Terraform-first event-driven fraud risk platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["fraudstream*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
