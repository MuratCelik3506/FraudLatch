name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy fraudlatch
      - name: Test
        run: pytest --cov=fraudlatch --cov-report=term-missing

  terraform:
    name: Terraform (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/terraform/local
          - infra/terraform/environments/aws-dev
          - infra/terraform/bootstrap/state
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.*'
      - name: Terraform root status
        id: root
        shell: bash
        run: |
          if find "${{ matrix.root }}" -maxdepth 1 -type f -name '*.tf' -print -quit 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check formatting
        if: steps.root.outputs.exists == 'true'
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize without a backend
        if: steps.root.outputs.exists == 'true'
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false
      - name: Validate
        if: steps.root.outputs.exists == 'true'
        working-directory: ${{ matrix.root }}
        run: terraform validate

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image when defined
        if: hashFiles('docker/api.Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: fraudlatch/api:ci
      - name: Build worker image when defined
        if: hashFiles('docker/worker.Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker.Dockerfile
          push: false
          tags: fraudlatch/worker:ci
      - name: Build dispatcher image when defined
        if: hashFiles('docker/dispatcher.Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dispatcher.Dockerfile
          push: false
          tags: fraudlatch/dispatcher:ci
